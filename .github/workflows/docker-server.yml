# Builds the standalone happy-server image (root Dockerfile: PGlite embedded
# Postgres, local file storage, in-memory event bus — no Postgres, Redis, or
# S3) and pushes it to GHCR for self-hosted deployments to pull.

name: Build and Push Server Image

on:
  push:
    branches: [main]
    # Monorepo: a happy-app change alone should not trigger a server image
    # rebuild. Everything listed here feeds the root Dockerfile.
    paths:
      - 'packages/happy-server/**'
      - 'packages/happy-wire/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/docker-server.yml'
  # Path filters mean an upstream merge touching nothing above produces no
  # image. This is the escape hatch for "rebuild anyway".
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Suffixed because this repo also ships the CLI and the app; a bare
  # <owner>/happy image name would be ambiguous.
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The root Dockerfile installs the whole pnpm workspace — including
      # happy-app's Expo dependency tree — before it reaches happy-server.
      # That plus the build layers runs a hosted runner close to its disk
      # limit. Drop preinstalled toolchains this build never uses.
      # Remove this step if "no space left on device" never shows up.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # No separate test job: stage 2 of the Dockerfile runs
      # `pnpm --filter happy-server build`, which is `tsc --noEmit`. A type
      # error fails the image build, so the gate is already here.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache, deliberately. Measured on run 30517794444, the
          # first and only cached build: 4.8 min to build and push cold,
          # 12.7 min to export the cache afterwards (189.6s preparing,
          # 574.0s sending). The export cost 2.6x the build it existed to
          # accelerate, and a full cache hit could only ever save those
          # 4.8 min. Uncached is ~6-7 min every time, with no cache-eviction
          # variance. Revisit only if the cold build time grows a lot.
